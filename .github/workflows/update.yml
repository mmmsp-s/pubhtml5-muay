name: อัปเดตรายการนิยาย

on:
  schedule:
    - cron: "17 23 * * *"   # ทุกวัน 06:17 เวลาไทย
  workflow_dispatch:
  push:
    paths: ["scraper/**", "site/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: ดึงรายการจาก pubhtml5
        run: python scraper/scrape.py
      - name: เก็บหน้าเว็บดิบไว้ตรวจ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
      - name: บันทึก books.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/books.json
          git diff --cached --quiet || git commit -m "อัปเดตรายการนิยาย"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
